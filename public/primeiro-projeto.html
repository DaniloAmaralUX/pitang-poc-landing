<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype Viewer · Pitang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   VIEWER CHROME: Pitang, with Firecrawl-inspired semantic tokens.
   Theme reference: https://www.ui-skills.com/design-md/firecrawl
   ========================================================================== */
:root {
  /* Existing palette; components consume role tokens below. */
  --neutral-0: #ffffff; --neutral-50: #f9f9f9; --neutral-100: #f5f5f5;
  --neutral-150: #ededed; --neutral-200: #e8e8e8; --neutral-250: #dbdbdb;
  --neutral-300: #d9d9d9; --neutral-350: #c2c2c2; --neutral-400: #a3a3a3;
  --neutral-500: #6b6b6b; --neutral-600: #525252; --neutral-700: #404040;
  --neutral-725: #3d3d3d; --neutral-750: #333333; --neutral-800: #2a2a2a;
  --neutral-850: #262626; --neutral-875: #1f1f1f; --neutral-900: #171717;
  --neutral-925: #141414; --neutral-950: #0a0a0a;
  --orange-50: #fff2ed; --orange-300: #ff8a56; --orange-500: #fa5d19;
  --orange-700: #ad3908; --orange-950: #301d15;
  --bg: var(--neutral-50);
  --panel: var(--neutral-0);
  --ink: var(--neutral-850);
  --ink-2: var(--neutral-600);
  --ink-3: var(--neutral-500);
  --line: var(--neutral-200);
  --line-2: var(--neutral-300);
  --control-border: var(--neutral-500);
  --tint: #0000000a;
  --tint-2: #0000000f;
  --pop: var(--neutral-0);
  --pop-sh: 0 1px 3px rgba(0,0,0,.04), 0 8px 24px -8px rgba(0,0,0,.12);
  --accent: var(--orange-500);
  --accent-text: var(--orange-700);
  --accent-border: var(--orange-700);
  --accent-tint: var(--orange-50);
  --focus: var(--orange-700);
  --inverse-bg: var(--neutral-850); --inverse-ink: var(--neutral-50);
  --chrome-bg: var(--neutral-250); --chrome-field-bg: var(--neutral-100);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --f-ui: "Inter", system-ui, -apple-system, sans-serif;
  --f-display: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: var(--neutral-950); --panel: var(--neutral-925);
  --ink: var(--neutral-100); --ink-2: var(--neutral-350); --ink-3: var(--neutral-400);
  --line: var(--neutral-800); --line-2: var(--neutral-700);
  --control-border: var(--neutral-400);
  --tint: #ffffff0a; --tint-2: #ffffff0f;
  --pop: var(--neutral-875); --pop-sh: 0 0 0 1px var(--line), 0 8px 24px -8px #00000066;
  --accent-text: var(--orange-300); --accent-border: var(--orange-300);
  --accent-tint: var(--orange-950); --focus: var(--orange-300);
  --inverse-bg: var(--neutral-100); --inverse-ink: var(--neutral-950);
  --chrome-bg: var(--neutral-800); --chrome-field-bg: var(--neutral-700);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
h1, h2, h3, .stage-ver { text-wrap: balance; }
.n-motion, .tour-b, .today-note, .pop { text-wrap: pretty; }
body { background: var(--bg); color: var(--ink); font: 400 13.5px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip-link { position: fixed; top: 12px; left: 12px; z-index: 2000; padding: 12px 16px; border-radius: 8px; color: var(--ink); background: var(--panel); box-shadow: var(--pop-sh); transform: translateY(-200%); }
.skip-link:focus { transform: none; }

.app {
  height: 100dvh; min-height: 640px;
  display: grid; grid-template-columns: 300px 1fr 300px; gap: 0;
}

/* ---------- Left rail ---------- */
.rail { display: flex; flex-direction: column; min-height: 0; padding: 28px 20px 24px 28px; border-right: 1px solid var(--line); background: var(--panel); }
.brand { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.brand-logo { display: flex; align-items: center; min-height: 34px; }
.brand-logo svg { display: block; width: 112px; height: auto; flex: none; }

.flows { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: none; }
.flow-btn {
  min-height: 40px;
  width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; align-items: baseline;
  padding: 10px 10px 11px; border-radius: 8px; color: var(--ink-2);
  transition: background-color 150ms ease, color 150ms ease, transform 140ms var(--ease-out);
}
.flow-btn:active { transform: scale(0.985); }
.flow-num { font: 600 11px/1 var(--f-ui); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.flow-title { font: 500 14px/1.4 var(--f-ui); color: var(--ink); }
.flow-sum { grid-column: 2; font-size: 12px; line-height: 1.35; color: var(--ink-3); }
.flow-btn[aria-current="true"] { background: var(--accent-tint); box-shadow: inset 2px 0 var(--accent-border); }
.flow-btn[aria-current="true"] .flow-num { color: var(--accent-text); }
@media (hover: hover) and (pointer: fine) { .flow-btn:hover:not([aria-current="true"]) { background: var(--tint); } }

.controls { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ctl-label { font-size: 12px; line-height: 1.4; color: var(--ink-3); min-width: 0; }
.seg { position: relative; display: inline-flex; padding: 2px; border-radius: 8px; background: var(--tint); }
.seg button { position: relative; z-index: 1; height: 26px; min-width: 40px; padding: 0 10px; border-radius: 6px; font: 550 12px/1 var(--f-ui); color: var(--ink-3); transition: color 150ms ease; }
.seg button::after { content: ""; position: absolute; inset: -7px 0; }
.seg button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--control-border); }
.seg-thumb { position: absolute; z-index: 0; top: 2px; left: 0; height: 26px; border-radius: 6px; background: var(--pop); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px var(--line-2); }
.seg[data-ready] .seg-thumb { transition: transform 220ms var(--ease-out), width 220ms var(--ease-out); }
.keys { margin-top: 6px; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; }
kbd { font: 600 10.5px/1 var(--f-ui); padding: 2px 5px; border-radius: 4px; background: var(--tint-2); color: var(--ink-2); }

/* ---------- Stage ---------- */
.stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 22px 16px 0; }
.stage-h { text-align: center; min-height: 52px; flex: none; }
.stage-flow { font: 600 11px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stage-ver { font: 500 28px/1.15 var(--f-display); letter-spacing: -.02em; margin: 6px 0 0; }
.device-wrap { position: relative; flex: none; margin-top: 10px; }
.device {
  position: absolute; top: 0; left: 0; width: 414px; height: 868px;
  padding: 12px; border-radius: 66px; background: #0b0b0c;
  box-shadow: 0 0 0 1.5px #3a3b3d, 0 0 0 3px #0b0b0c, 0 40px 80px -24px rgba(0,0,0,.45), 0 12px 24px -12px rgba(0,0,0,.3);
  transform-origin: top left;
}
.device .ph { border-radius: 54px; clip-path: inset(0 round 54px); }
.island { position: absolute; z-index: 100; top: 23px; left: 50%; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px; background: #000; pointer-events: none; }

/* ---------- Notes ---------- */
.notes { min-height: 0; overflow-y: auto; padding: 28px 28px 120px 20px; border-left: 1px solid var(--line); scrollbar-width: thin; background: var(--panel); }
.n-block { padding: 16px 0; border-bottom: 1px solid var(--line); }
.n-block:first-child { padding-top: 0; }
.n-h { font: 600 11px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.n-axis { font: 500 14.5px/1.45 var(--f-ui); color: var(--ink); margin: 0; text-wrap: pretty; }
.n-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.n-list li { position: relative; padding-left: 16px; color: var(--ink-2); text-wrap: pretty; }
.n-list li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 1.5px; background: var(--ink-3); }
.n-try li::before { width: 6px; height: 6px; top: .5em; border-radius: 50%; background: var(--accent); }
.n-motion { color: var(--ink-2); margin: 0; }

.personas { display: flex; flex-wrap: wrap; gap: 6px; }
.persona { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px 0 4px; border-radius: 999px; background: var(--tint); font: 550 12.5px/1 var(--f-ui); transition: background-color 150ms ease, transform 140ms var(--ease-out); }
.persona:active { transform: scale(0.97); }
.persona i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 10px/1 var(--f-ui); font-style: normal; color: #fff; }
.persona[aria-expanded="true"] { background: var(--tint-2); }
.persona { min-height: 40px; height: auto; padding-block: 4px; text-align: left; line-height: 1.3; }
.persona i { flex: none; }
@media (hover: hover) and (pointer: fine) { .persona:hover { background: var(--tint-2); } }
.pop {
  position: fixed; z-index: 50; width: 260px; padding: 14px 16px; border-radius: 14px; background: var(--pop); box-shadow: var(--pop-sh);
  font-size: 12.5px; color: var(--ink-2);
  transform-origin: var(--origin, top left);
  opacity: 0; transform: scale(0.96); pointer-events: none;
  transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
}
.pop[data-open] { opacity: 1; transform: scale(1); pointer-events: auto; }
.pop { max-width: calc(100vw - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; overscroll-behavior: contain; }
.pop .preview-action { margin-top: 10px; }
.pop b { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }
.pop q { display: block; margin: 8px 0; font: 600 16px/1.15 var(--f-display); color: var(--ink); quotes: "\201C" "\201D"; }
.pop .src { margin-top: 8px; font-size: 11px; color: var(--ink-3); }

.today { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.today-btn { display: flex; flex-direction: column; gap: 6px; text-align: left; transition: transform 140ms var(--ease-out); }
.today-btn:active { transform: scale(0.97); }
.today-btn img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; border-radius: 8px; box-shadow: 0 0 0 1px var(--line-2); background: var(--tint); }
.today-btn span { font-size: 11px; line-height: 1.3; color: var(--ink-3); }
.today-note { margin: 10px 0 0; font-size: 11.5px; color: var(--ink-3); }

/* ---------- Lightbox (modal: centred origin) ---------- */
.lb { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 40px; background: rgba(10,10,10,.62); opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease-out); }
.lb[data-open] { opacity: 1; pointer-events: auto; }
.lb-inner { position: relative; max-width: min(1100px, 92vw); max-height: 88vh; overflow: auto; border-radius: 14px; background: var(--pop); box-shadow: var(--pop-sh); transform: scale(0.96); transition: transform 200ms var(--ease-out); }
.lb[data-open] .lb-inner { transform: scale(1); }
.lb img { display: block; max-width: 100%; height: auto; }
.lb-cap { position: sticky; bottom: 0; padding: 10px 14px; font-size: 12.5px; color: var(--ink-2); background: var(--pop); border-top: 1px solid var(--line); }
.lb-close { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.12); }
.lb-close svg { width: 20px; height: 20px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Short laptop screens: tighten the rail ---------- */
@media (max-height: 860px) and (min-width: 761px) {
  .rail { padding-top: 22px; }
  .brand { padding-bottom: 16px; }
  .flow-btn { padding: 8px 10px; }
  .flow-sum { display: none; }
  .keys { display: none; }
}

/* ---------- Narrow screens: stack ---------- */
@media (max-width: 1100px) {
  .app { grid-template-columns: 260px 1fr; }
  .notes { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); padding: 24px 28px 120px; }
  .app { height: auto; }
  .rail { position: sticky; top: 0; height: 100dvh; }
}
@media (max-width: 760px) {
  .app { display: block; }
  .rail { position: static; height: auto; padding: 20px 16px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .flows { flex-direction: row; overflow-x: auto; margin-top: 12px; gap: 6px; }
  .flow-btn { width: auto; white-space: nowrap; grid-template-columns: auto auto; padding: 9px 12px; }
  .flow-sum { display: none; }
  .controls { flex-direction: row; flex-wrap: wrap; gap: 10px 16px; }
  .keys { display: none; }
  .stage { padding: 18px 16px 0; }
  .notes { padding: 20px 16px 120px; }
}
@media (prefers-reduced-motion: reduce) {
  .seg[data-ready] .seg-thumb, .pop, .lb, .lb-inner { transition-duration: 1ms; }
}

/* Picker: never wrap, scroll sideways on narrow screens (viewer theme) */
.proto-picker { white-space: nowrap; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; }
.proto-picker::-webkit-scrollbar { display: none; }
.proto-picker-item { flex: none; }

/* Preview controls stay outside the scrollable device. */
.stage { height: 100dvh; min-height: 640px; padding-inline: 0; }
.stage-h, .preview-toolbar { margin-inline: 16px; }
.preview-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; flex: none; }
.preview-action { min-height: 40px; padding: 8px 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); font-size: 12px; }
.preview-action[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-text); box-shadow: inset 0 -2px var(--accent-border); }
.preview-scale { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.preview-viewport { flex: 1; width: 100%; min-height: 0; overflow: auto; padding: 16px; overscroll-behavior: contain; }
.preview-viewport .device-wrap { margin: 0 auto; }
.stage > .proto-picker { position: relative; bottom: auto; left: auto; transform: none; flex: none; max-width: calc(100% - 32px); margin: 14px 0; }
.app[data-expanded] { display: block; }
.app[data-expanded] > .rail, .app[data-expanded] > .notes { display: none; }
@media (hover: hover) and (pointer: fine) { .preview-action:hover { background: var(--tint); } }
@media (max-width: 760px), (pointer: coarse) { .preview-action { min-height: 44px; } }

/* ---------- First-visit tour ---------- */
.tour-again { all: unset; cursor: pointer; align-self: flex-start; font: 600 12.5px/1 var(--f-ui); color: var(--ink-2); padding: 9px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line-2); transition: background-color 150ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .tour-again:hover { background: var(--tint); } }
.tour-again:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tour-again { box-sizing: border-box; min-height: 40px; display: flex; align-items: center; }
.tour { position: fixed; inset: 0; z-index: 2147483647; visibility: hidden; pointer-events: none; }
.tour[data-open] { visibility: visible; pointer-events: auto; }
.tour-hole { position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 16px; box-shadow: 0 0 0 200vmax rgba(8,9,10,.55), 0 0 0 2px rgba(255,255,255,.9); opacity: 0; pointer-events: none;
  transition: transform 320ms var(--ease-out), width 320ms var(--ease-out), height 320ms var(--ease-out), opacity 200ms var(--ease-out); }
.tour[data-open] .tour-hole { opacity: 1; }
.tour-hole[data-off] { width: 0 !important; height: 0 !important; box-shadow: 0 0 0 200vmax rgba(8,9,10,.55); }
.tour-card { position: absolute; left: 0; top: 0; width: 320px; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 18px 18px 14px; border-radius: 16px; background: var(--pop); color: var(--ink); box-shadow: var(--pop-sh); }
.tour-card > * { transition: opacity 200ms var(--ease-out); }
.tour-card:not([data-in]) > .tour-t, .tour-card:not([data-in]) > .tour-b { opacity: 0; }
.tour[data-open] .tour-card { transition: transform 320ms var(--ease-out); }
.tour-card::before { content: ""; position: absolute; width: 12px; height: 12px; background: var(--pop); transform: rotate(45deg); }
.tour-card[data-side="right"]::before { left: -6px; top: 24px; }
.tour-card[data-side="left"]::before { right: -6px; top: 24px; }
.tour-card[data-side="top"]::before { left: calc(50% - 6px); bottom: -6px; }
.tour-card[data-side="none"]::before { display: none; }
.tour-k { margin: 0; font: 650 11px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); }
.tour-t { margin: 8px 0 0; font: 700 20px/1.15 var(--f-ui); letter-spacing: -.01em; }
.tour-b { margin: 8px 0 0; font: 400 14px/1.5 var(--f-ui); color: var(--ink-2); }
.tour-b kbd { font-size: 11px; }
.tour-f { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
.tour-dots { display: flex; gap: 5px; margin-right: auto; }
.tour-dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line-2); transition: width 200ms var(--ease-out), background-color 200ms; }
.tour-dots i[data-on] { width: 16px; background: var(--ink); }
.tour-f button { all: unset; box-sizing: border-box; cursor: pointer; min-height: 36px; padding: 0 12px; border-radius: 999px; font: 600 13px/36px var(--f-ui); color: var(--ink-2); transition: transform 120ms var(--ease-out), background-color 150ms; }
.tour-f button[hidden] { display: none; }
.tour-f button { min-height: 40px; }
.tour-f .tour-next { background: var(--inverse-bg); color: var(--inverse-ink); padding: 0 16px; }
.tour-f button:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .tour-f .tour-skip:hover, .tour-f .tour-back:hover { background: var(--tint-2); } }
.tour-f button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .tour-hole, .tour[data-open] .tour-card, .tour-card > *, .tour-dots i { transition: none; } }

/* Today placeholders (template: no screenshots yet) */
.today-ph { display: grid; place-items: center; aspect-ratio: 9 / 13; border-radius: 10px; border: 1.5px dashed var(--line-2); padding: 10px; text-align: center; }
.today-ph span { font: 500 11.5px/1.35 var(--f-ui); color: var(--ink-3); }

/* ---------- Device frames: iOS (default), Android, Web ---------- */
.device[data-device="android"] { width: 436px; height: 939px; border-radius: 44px; }
.device[data-device="android"] .ph { width: 412px; height: 915px; border-radius: 32px; clip-path: inset(0 round 32px); }
.device[data-device="android"] .island { top: 24px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; }
.device[data-device="web"] { width: 1280px; height: 820px; padding: 40px 0 0; border-radius: 12px; background: var(--chrome-bg);
  box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 40px 80px -24px rgba(0,0,0,.4), 0 12px 24px -12px rgba(0,0,0,.25); }
.device[data-device="web"]::before { content: ""; position: absolute; top: 15px; left: 18px; width: 11px; height: 11px; border-radius: 50%; background: #ef6a5e; box-shadow: 18px 0 0 #f4be4f, 36px 0 0 #61c454; }
.device[data-device="web"] .island { top: 8px; width: 440px; height: 24px; margin-left: -220px; border-radius: 7px; background: var(--chrome-field-bg); }
.device[data-device="web"] .ph { width: 1280px; height: 780px; border-radius: 0 0 12px 12px; clip-path: inset(0 round 0 0 12px 12px); }

/* Localized controls: extend touch targets without overlapping adjacent rows. */
@media (max-width: 760px), (pointer: coarse) {
  .controls { gap: 14px 16px; }
  .seg button { min-width: 44px; }
  .seg button::after { inset: -9px 0; }
  .flow-btn, .persona, .tour-again, .tour-f button { min-height: 44px; }
}

/* Picker adapted from Design Engineering; surface tokens follow the viewer theme. */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 12px;
  background: var(--pop);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: 0 0 0 1px var(--line), var(--pop-sh);
  font-family: var(--f-ui);
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 40px;
  border-radius: 8px;
  background: var(--accent-tint);
  will-change: transform;
}

.proto-picker[data-ready] .proto-picker-highlight {

    if (!Array.isArray(list) || !list.length) throw new Error(`Registre ao menos uma versão para '${flowId}'.`);
    list.forEach((version, index) => {
      const where = `${flowId}, versão ${index + 1}`;
      if (!version || typeof version.name !== "string" || !version.name.trim() || typeof version.render !== "function") {
        throw new Error(`Em ${where}, preencha name e uma função render(root, ctx).`);
      }
      for (const key of ["fixes", "tryThis", "personas"]) {
        if (version[key] !== undefined && (!Array.isArray(version[key]) || version[key].some((item) => typeof item !== "string"))) {
          throw new Error(`Em ${where}, ${key} deve ser uma lista de textos.`);
        }
      }
      for (const id of version.personas || []) {
        if (!Object.hasOwn(PERSONAS, id)) throw new Error(`A persona '${id}' de ${where} não existe em project.json.`);
      }
    });
    registry[flowId] = list.slice();
  }
  window.Proto = {
    project: PROJECT,
    storageKey,
    versions: register,
    personas: PERSONAS,
    get registry() { return registry; },
    get flows() { return FLOWS; },
  };

  /* ---- State ---- */
  const store = {
    get(k, d) {
      try {
        let value = localStorage.getItem(storageKey(k));
        if (value == null && PROJECT.id === "pitang-bikes-demo") value = localStorage.getItem("protokit:" + k);
        return value == null ? d : value;
      } catch { return d; }
    },
    set(k, v) { try { localStorage.setItem(storageKey(k), v); } catch {} },
  };
  const preference = (key, options, fallback) => { const value = store.get(key, fallback); return options.includes(value) ? value : fallback; };
  const params = (() => { try { return new URLSearchParams(location.search); } catch { return new URLSearchParams(); } })();
  const prefersReduced = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } })();
  const state = {
    flow: Math.max(0, FLOWS.findIndex((f) => f.id === (params.get("flow") || store.get("flow", FLOWS[0].id)))),
    v: (parseInt(params.get("v") || store.get("v", "1"), 10) || 1) - 1,
    theme: preference("theme", ["light", "dark"], "light"),
    text: preference("text", ["default", "large"], "default"),
    motion: prefersReduced ? "reduced" : preference("motion", ["full", "reduced"], "full"),
    annot: preference("annot", ["on", "off"], "on"),
    device: ["ios", "android", "web"].includes(params.get("device")) ? params.get("device") : preference("device", ["ios", "android", "web"], "ios"),
  };
  /* Frame sizes: outer device box and the screen inside it (CSS px) */
  const DEVICES = {
    ios: { w: 414, h: 868, label: "iPhone" },
    android: { w: 436, h: 939, label: "Android" },
    web: { w: 1280, h: 820, label: "Web" },
  };

  let screen, deviceWrap, device, cleanup = null, renderFrame = 0;
  let expanded = false, actualSize = false;

  /* ---- Build chrome ---- */
  function build() {
    const flowsEl = document.querySelector(".flows");
    flowsEl.innerHTML = FLOWS.map((f, i) => `<li><button class="flow-btn" data-flow="${i}"><span class="flow-num">${String(i + 1).padStart(2, "0")}</span><span class="flow-title">${esc(f.title)}</span><span class="flow-sum">${esc(f.sum)}</span></button></li>`).join("");
    flowsEl.addEventListener("click", (e) => { const b = e.target.closest(".flow-btn"); if (b) setFlow(+b.dataset.flow, 0); });

    screen = document.getElementById("screen");
    deviceWrap = document.querySelector(".device-wrap");
    device = document.querySelector(".device");

    document.querySelector("[data-expand]").addEventListener("click", () => setExpanded(!expanded));
    document.querySelector("[data-size]").addEventListener("click", (event) => {
      actualSize = !actualSize;
      event.currentTarget.setAttribute("aria-pressed", String(actualSize));
      fit();
    });

    segs();
    fit();
    window.addEventListener("resize", () => { fit(); moveHighlight(); });
    window.addEventListener("popstate", () => {
      const query = new URLSearchParams(location.search);
      const flow = Math.max(0, FLOWS.findIndex((item) => item.id === query.get("flow")));
      const version = Math.max(0, (parseInt(query.get("v"), 10) || 1) - 1);
      const deviceName = query.get("device");
      if (Object.hasOwn(DEVICES, deviceName)) state.device = deviceName;
      document.querySelectorAll(".seg").forEach((seg) => seg._sync?.());
      if (flow === state.flow && version === state.v) { applyPrefs(); return; }
      const scrollTop = history.state?.viewerScroll || 0;
      setFlow(flow, version, "replace", { focus: true, scrollTop });
    });

    // Keyboard: versions (picker contract), flows ↑↓
    document.addEventListener("keydown", (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (e.target.closest(".pop")) return;

      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= n) setVersion(num - 1);
      else if (e.key === "ArrowRight") setVersion((state.v + 1) % n);
      else if (e.key === "ArrowLeft") setVersion((state.v - 1 + n) % n);
      else if (e.key === "ArrowDown") { e.preventDefault(); setFlow((state.flow + 1) % FLOWS.length, 0); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setFlow((state.flow - 1 + FLOWS.length) % FLOWS.length, 0); }

    });

  }

  /* ---- Segmented controls (theme / text / motion) ---- */
  function segs() {
    document.querySelectorAll(".seg").forEach((seg) => {
      const key = seg.dataset.key;
      const btns = [...seg.querySelectorAll("button")];
      const thumb = document.createElement("span"); thumb.className = "seg-thumb"; thumb.setAttribute("aria-hidden", "true"); seg.prepend(thumb);
      const sync = () => {
        btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.val === state[key])));
        const a = btns.find((b) => b.dataset.val === state[key]) || btns[0];
        thumb.style.width = a.offsetWidth + "px"; thumb.style.transform = `translateX(${a.offsetLeft - 2}px)`;
      };
      btns.forEach((b) => b.addEventListener("click", () => { state[key] = b.dataset.val; store.set(key, state[key]); sync(); applyPrefs(); if (key === "device") persist(); }));
      seg._sync = sync; sync();
      requestAnimationFrame(() => requestAnimationFrame(() => seg.setAttribute("data-ready", "")));
    });
  }
  function applyPrefs() {
    document.documentElement.dataset.theme = state.theme;
    screen.dataset.theme = state.theme;
    screen.style.setProperty("--fs", state.text === "large" ? "1.18" : "1");
    screen.toggleAttribute("data-reduced-motion", state.motion === "reduced");
    screen.dataset.annot = state.annot;
    screen.dataset.device = state.device;
    if (device && device.dataset.device !== state.device) { device.dataset.device = state.device; fit(); }
  }

  /* ---- Fit phone to available height ---- */
  function setExpanded(value) {

  function fit() {

    const availH = viewport.clientHeight - 32;
    const availW = viewport.clientWidth - 32;
    const D = DEVICES[state.device] || DEVICES.ios;
    const s = actualSize ? 1 : Math.max(0.1, Math.min(1, availH / D.h, availW / D.w));
    device.dataset.device = state.device;
    device.style.transform = `scale(${s})`;
    deviceWrap.style.width = D.w * s + "px";
    deviceWrap.style.height = D.h * s + "px";
    document.querySelector(".preview-scale").textContent = `${Math.round(s * 100)}% · ${D.w} px`;
    window.__phoneScale = s;
  }

  /* ---- Picker (adapted from Design Engineering PICKER.md) ---- */
  let picker, highlight, items = [];
  function buildPicker() {
    const vs = versions();
    if (!picker) { picker = document.createElement("nav"); picker.className = "proto-picker"; picker.setAttribute("aria-label", "Versões do protótipo"); (document.querySelector(".stage") || document.body).appendChild(picker); }
    picker.removeAttribute("data-ready");
    picker.innerHTML = `<span class="proto-picker-highlight" aria-hidden="true"></span>` +
      vs.map((v) => `<button class="proto-picker-item">${esc(v.name)}</button>`).join("") +
      `<span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Repetir animação (R)">↻</button>`;
    highlight = picker.querySelector(".proto-picker-highlight");
    items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
    items.forEach((el, i) => el.addEventListener("click", () => setVersion(i)));

  const versions = () => registry[FLOWS[state.flow].id] || [];

  function setFlow(i, v = 0, historyMode = "push", restore = {}) {
    state.flow = i; state.v = v;

  }

    store.set("flow", FLOWS[state.flow].id); store.set("v", String(state.v + 1));

      const u = new URL(location.href);
      u.searchParams.set("flow", FLOWS[state.flow].id); u.searchParams.set("v", state.v + 1); u.searchParams.set("device", state.device);

    document.querySelector(".stage-ver").textContent = versions()[state.v]?.name || "-";
    document.title = `${versions()[state.v]?.name || f.title} · ${PROJECT.name}`;

    mount(restore);
  }

  /* ---- Mount: clear, then render next frame so entrances re-run ---- */
  function mount(restore = {}) {
    const ver = versions()[state.v];

    const moveFocus = restore.focus || screen.contains(document.activeElement);

    renderFrame = requestAnimationFrame(() => {
      try {
        cleanup = ver.render(screen, ctx) || null;

        const scroll = screen.querySelector(".sk-scroll");
        if (scroll && restore.scrollTop) scroll.scrollTop = restore.scrollTop;
      }
      catch (err) { console.error(err); screenError("Não foi possível abrir esta versão", "Revise a função render desta versão e gere o HTML novamente.", err); }
    });
  }

  function screenError(title, message, error) {
    screen.innerHTML = `<section class="screen-error" role="alert"><h2>${esc(title)}</h2><p>${esc(message)}</p>${error ? `<details><summary>Detalhes técnicos</summary><pre>${esc(error.stack || error)}</pre></details>` : ""}<button class="sk-btn" type="button">Recarregar prévia</button></section>`;
    screen.querySelector("button").addEventListener("click", () => location.reload());
  }

  const ctx = {
    go(flowId, v = 0) {
      const i = FLOWS.findIndex((f) => f.id === flowId);
      if (i < 0 || !Number.isInteger(v) || !registry[flowId]?.[v]) {
        console.warn("Destino do protótipo indisponível:", flowId, v);
        window.Kit.toast(screen, "Destino indisponível. Confira o fluxo e a versão no arquivo de telas.");
        return false;
      }
      setFlow(i, v); return true;
    },
    toast(msg, o) { window.Kit.toast(screen, msg, o); },
    get theme() { return state.theme; },
    get large() { return state.text === "large"; },
    get reduced() { return state.motion === "reduced"; },
    personas: PERSONAS,
  };

  /* ---- Global tab routing: one map for every screen. A screen that needs its own
     behaviour for a tab calls e.preventDefault() in its handler. ---- */
  const TAB_ROUTES = Object.fromEntries((PROJECT.navigation || []).map((tab) => [tab.id, [tab.flow, tab.version || 0]]));
  document.addEventListener("click", (e) => {
    const t = e.target.closest(".ph .sk-tab");
    if (!t || e.defaultPrevented) return;
    const r = TAB_ROUTES[t.dataset.tab]; if (!r) return;
    const cur = FLOWS[state.flow];
    if (cur.id === r[0] && state.v === r[1]) { const sc = screen.querySelector(".sk-scroll"); if (sc) sc.scrollTo({ top: 0, behavior: state.motion === "reduced" ? "auto" : "smooth" }); return; }
    ctx.go(r[0], r[1]);
  });

  /* ---- Notes panel ---- */
  function notes() {
    closePop(false);
    const f = FLOWS[state.flow], v = versions()[state.v] || {};
    const el = document.querySelector(".notes");
    const ps = (v.personas || []).map((id) => { const p = PERSONAS[id]; return p ? `<button class="persona" data-p="${esc(id)}" aria-expanded="false" aria-haspopup="dialog" aria-controls="persona-details"><i style="background:${esc(p.color)}">${esc(p.ini)}</i>${esc(p.name)}</button>` : ""; }).join("");
    const li = (arr) => (arr || []).map((x) => `<li>${esc(x)}</li>`).join("");
    el.innerHTML = `
      ${v.axis ? `<section class="n-block"><h2 class="n-h">Proposta</h2><p class="n-axis">${esc(v.axis)}</p></section>` : ""}
      ${ps ? `<section class="n-block"><h2 class="n-h">Para quem</h2><div class="personas">${ps}</div></section>` : ""}
      ${v.fixes?.length ? `<section class="n-block"><h2 class="n-h">Problema que resolve</h2><ul class="n-list">${li(v.fixes)}</ul></section>` : ""}
      ${v.tryThis?.length ? `<section class="n-block"><h2 class="n-h">Experimente</h2><ul class="n-list n-try">${li(v.tryThis)}</ul></section>` : ""}
      ${v.motion ? `<section class="n-block"><h2 class="n-h">Animação</h2><p class="n-motion">${esc(v.motion)}</p></section>` : ""}
      ${v.tradeoff ? `<section class="n-block"><h2 class="n-h">Pontos de atenção</h2><p class="n-motion">${esc(v.tradeoff)}</p></section>` : ""}
      ${f.today.length ? `<section class="n-block"><h2 class="n-h">Experiência atual</h2><div class="today">${f.today.map((cap) => `<div class="today-ph"><span>${esc(cap)}</span></div>`).join("")}</div><p class="today-note">Espaço para imagens da experiência atual, usadas na comparação com cada proposta.</p></section>` : ""}`;
    el.querySelectorAll(".persona").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); togglePop(b); }));
  }

  /* ---- Persona popover (origin-aware) ---- */
  let pop, popFor = null;
  function togglePop(btn) {
    if (popFor === btn) return closePop();
    closePop();
    const p = PERSONAS[btn.dataset.p];
    if (!pop) { pop = document.createElement("div"); pop.className = "pop"; pop.id = "persona-details"; pop.tabIndex = -1; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-labelledby", "persona-name"); document.body.appendChild(pop); }
    pop.innerHTML = `<b id="persona-name">${esc(p.name)} · ${esc(p.tag)}</b>${esc(p.line)}<q>${esc(p.quote)}</q><div><strong>Necessidades:</strong> ${esc(p.needs)}</div><div class="src">Perfil fictício usado neste exemplo</div><button type="button" class="preview-action">Fechar perfil</button>`;
    pop.querySelector("button").addEventListener("click", () => closePop());
    pop.hidden = false;
    const r = btn.getBoundingClientRect();
    let left = Math.max(12, Math.min(r.left, window.innerWidth - pop.offsetWidth - 12)), top = r.bottom + 8;
    const below = top + pop.offsetHeight < window.innerHeight - 12;
    if (!below) top = r.top - 8 - pop.offsetHeight;
    top = Math.max(12, Math.min(top, window.innerHeight - pop.offsetHeight - 12));
    pop.style.left = left + "px"; pop.style.top = top + "px";
    pop.style.setProperty("--origin", `${r.left - left + 16}px ${below ? "0" : "100%"}`);
    btn.setAttribute("aria-expanded", "true"); popFor = btn;
    requestAnimationFrame(() => { if (popFor !== btn) return; pop.setAttribute("data-open", ""); pop.focus({ preventScroll: true }); });
  }
  function closePop(restore = true) {
    const trigger = popFor;
    if (pop) { pop.removeAttribute("data-open"); pop.hidden = true; }
    if (trigger) { trigger.setAttribute("aria-expanded", "false"); if (restore && trigger.isConnected) trigger.focus({ preventScroll: true }); }
    popFor = null; return !!trigger;
  }

  /* ---- Boot after all screen files have registered ---- */
  window.addEventListener("DOMContentLoaded", () => {
    build();
    const vMax = (registry[FLOWS[state.flow].id] || []).length;
    setFlow(state.flow, Math.min(Math.max(0, state.v), Math.max(0, vMax - 1)), "replace");
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); moveHighlight(); document.querySelectorAll(".seg").forEach((s) => s._sync && s._sync()); });
  });
})();

/* ==========================================================================
   FIRST-VISIT TOUR: three steps: sections (left), directions (bottom), the why (right).
   Shows once per browser; "Show me around" in the rail replays it; ?tour=1 forces it.
   Skipped under automation (navigator.webdriver) so screenshots stay clean.
   ========================================================================== */
(function () {
  const KEY = window.Proto.storageKey("toured");
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set() { try { localStorage.setItem(KEY, "1"); } catch {} },
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const currentNames = () => [...document.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")].map((item) => item.textContent);
  const fine = () => { try { return matchMedia("(pointer: fine)").matches && innerWidth > 760; } catch { return true; } };
  const list = (arr) => arr.length < 2 ? (arr[0] || "") : arr.slice(0, -1).join(", ") + " e " + arr[arr.length - 1];

  const steps = [
    {
      target: () => document.querySelector(".flows"), place: "right",
      title: "Navegue pelos fluxos",
      body: () => `Os fluxos de ${esc(window.Proto.project.name)} ficam neste menu. Selecione um para explorar o protótipo.${fine() ? " Você também pode usar as teclas <kbd>↑</kbd> <kbd>↓</kbd> fora da prévia." : ""}`,
    },
    {
      target: () => document.querySelector(".proto-picker"), place: "top",
      title: "Explore as versões disponíveis",
      body: () => {
        const names = currentNames();
        return names.length > 1
          ? `Neste fluxo, compare ${esc(list(names))} nos botões abaixo do dispositivo. A seta circular reinicia a versão e suas interações.`
          : `Este fluxo tem uma versão: ${esc(names[0] || "ainda não registrada")}. A seta circular reinicia a tela. Outros fluxos podem ter mais versões.`;
      },
    },
    {
      target: () => document.querySelector(".notes"), place: "left",
      title: "Entenda cada proposta",
      body: () => `As notas descrevem a proposta e as interações que você pode experimentar. O conteúdo depende das informações registradas para cada versão.`,
    },
  ];

  let root, hole, card, i = 0, open = false, releaseFocus = null;

  function build() {
    root = document.createElement("div");
    root.className = "tour";
    root.innerHTML = `<div class="tour-hole" aria-hidden="true"></div>
      <section class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-t" aria-describedby="tour-b">
        <p class="tour-k"></p><h2 class="tour-t" id="tour-t"></h2><p class="tour-b" id="tour-b"></p>
        <div class="tour-f"><span class="tour-dots" aria-hidden="true">${steps.map(() => "<i></i>").join("")}</span>
          <button type="button" class="tour-skip">Pular</button>
          <button type="button" class="tour-back">Voltar</button>
          <button type="button" class="tour-next">Avançar</button></div>
      </section>`;
    document.body.appendChild(root);
    hole = root.querySelector(".tour-hole");
    card = root.querySelector(".tour-card");
    root.querySelector(".tour-skip").addEventListener("click", finish);
    root.querySelector(".tour-back").addEventListener("click", () => go(i - 1));
    root.querySelector(".tour-next").addEventListener("click", () => (i === steps.length - 1 ? finish() : go(i + 1)));
  }

  function place() {
    if (!open) return;
    const st = steps[i], t = st.target();
    const W = innerWidth, H = innerHeight, pad = 8, gap = 18, m = 12;
    const narrow = W <= 760;
    let r = t && t.getBoundingClientRect();
    const visible = r && r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < H;
    if (visible) {
      const top = Math.max(m, r.top - pad), left = Math.max(m, r.left - pad);
      const bottom = Math.min(H - m, r.bottom + pad), right = Math.min(W - m, r.right + pad);
      hole.style.transform = `translate(${left}px, ${top}px)`;
      hole.style.width = right - left + "px"; hole.style.height = bottom - top + "px";
      hole.removeAttribute("data-off");
    } else hole.setAttribute("data-off", "");
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let x, y, side = st.place;
    if (!visible || narrow) {
      // on phones the card takes the half of the screen the target isn't in
      const low = visible && (r.top + r.height / 2) > H / 2;
      x = (W - cw) / 2; y = low ? 20 : H - ch - 20; side = "none";
    }
    else if (side === "right") { x = r.right + pad + gap; y = r.top + 8; }
    else if (side === "left") { x = r.left - pad - gap - cw; y = r.top + 8; }
    else { x = r.left + r.width / 2 - cw / 2; y = r.top - pad - gap - ch; }
    if (side === "right" && x + cw > W - m) { x = (W - cw) / 2; y = H - ch - 20; side = "none"; }
    if (side === "left" && x < m) { x = (W - cw) / 2; y = H - ch - 20; side = "none"; }
    x = Math.min(W - cw - m, Math.max(m, x)); y = Math.min(H - ch - m, Math.max(m, y));
    card.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    card.dataset.side = side;
  }

  function go(n) {
    i = Math.max(0, Math.min(steps.length - 1, n));
    const st = steps[i];
    card.querySelector(".tour-k").textContent = `${i + 1} de ${steps.length}`;
    card.querySelector(".tour-t").textContent = st.title;
    card.querySelector(".tour-b").innerHTML = st.body();
    card.querySelector(".tour-back").hidden = i === 0;
    card.querySelector(".tour-next").textContent = i === steps.length - 1 ? "Entendi" : "Avançar";
    root.querySelectorAll(".tour-dots i").forEach((d, k) => d.toggleAttribute("data-on", k === i));
    const t = st.target();
    if (t && innerWidth <= 760) t.scrollIntoView({ block: "center", behavior: "instant" });
    card.removeAttribute("data-in");
    requestAnimationFrame(() => { place(); requestAnimationFrame(() => card.setAttribute("data-in", "")); });
    card.querySelector(".tour-next").focus({ preventScroll: true });
  }

  function start() {
    if (open) return;
    if (!root) build();
    open = true; root.setAttribute("data-open", "");
    releaseFocus = window.Kit.modalFocus(card, finish, { initial: card.querySelector(".tour-next") });
    go(0);
  }
  function finish() {
    if (!open) return;
    open = false; store.set();
    root.removeAttribute("data-open");
    releaseFocus?.(); releaseFocus = null;
  }

  // While the tour is open it owns the keyboard: the viewer's version/flow keys stay quiet.
  window.addEventListener("keydown", (e) => {
    if (!open) return;
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); e.stopPropagation(); i === steps.length - 1 ? finish() : go(i + 1); return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); e.stopPropagation(); go(i - 1); return; }
    if (e.key === "Tab" || e.key === "Enter" || e.key === " ") return;
    e.stopPropagation();
  }, true);
  window.addEventListener("resize", place);
  document.addEventListener("scroll", place, true);

  window.addEventListener("DOMContentLoaded", () => {
    const again = document.querySelector(".tour-again");
    if (again) again.addEventListener("click", start);
    let force = false;
    try { force = new URLSearchParams(location.search).get("tour") === "1"; } catch {}
    if (!force && (navigator.webdriver || store.get())) return;
    const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    ready.then(() => setTimeout(start, 700));
  });
})();
</script>
<script>(function () {
  const K = window.Kit;
  const draft = { name: "" };
  const frame = (root, active, body) => {
    root.innerHTML = `${K.bar({ title: "Primeiro projeto", icons: [] })}<div class="sk-scroll"><div class="sk-pad sample-page">${body}</div></div>${K.tabs(active)}`;
  };

  Proto.versions("briefing", [{
    name: "Formulário",
    axis: "Uma entrada simples, com validação e navegação para a prévia.",
    tryThis: ["Continue sem preencher para conferir a validação", "Informe um nome e abra a prévia", "Troque o dispositivo durante o preenchimento"],
    tradeoff: "Os dados deste exemplo ficam apenas na sessão e são apagados ao recarregar o HTML.",
    render(root, ctx) {
      frame(root, "briefing", `<form class="sk-stack"><h1>Dê um nome ao projeto</h1><p>Este é um exemplo mínimo para você adaptar na IDE.</p><label for="project-name">Nome do projeto</label><input class="sample-input" id="project-name" name="project-name" type="text" maxlength="80" required value="${K.esc(draft.name)}" placeholder="Central de solicitações"><button class="sk-btn" type="submit">Abrir prévia</button></form>`);
      const input = root.querySelector("input");
      const offInput = K.on(root, "input", "input", () => { draft.name = input.value; input.setCustomValidity(""); });
      const offSubmit = K.on(root, "form", "submit", (event) => {
          event.preventDefault();
          draft.name = input.value.trim();
          if (!draft.name) { input.setCustomValidity("Informe o nome do projeto."); input.reportValidity(); return; }
          ctx.go("review");
        });
      return () => { offInput(); offSubmit(); };
    },
  }]);

  Proto.versions("review", [{
    name: "Resumo",
    axis: "O valor informado aparece na segunda tela sem servidor ou bibliotecas adicionais.",
    tryThis: ["Confira o nome", "Volte ao formulário e altere o valor"],
    tradeoff: "Esta tela demonstra o contrato do viewer. Substitua o exemplo pelos fluxos do seu projeto.",
    render(root, ctx) {
      frame(root, "review", `<div class="sk-stack"><h1>${draft.name.trim() ? K.esc(draft.name.trim()) : "Nenhum nome informado"}</h1><p>${draft.name.trim() ? "A navegação e o estado local estão funcionando." : "Preencha o formulário para ver o resultado aqui."}</p><button class="sk-btn" type="button">Voltar ao formulário</button></div>`);
      return K.on(root, ".sk-btn", "click", () => ctx.go("briefing"));
    },
  }]);
})();
</script>
